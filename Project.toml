# moltest-mock's own manifest: built and tested with molto.
# Consumers add it with `molto add git+https://github.com/moltobuild/moltest-mock --dev`.
[package]
name = "moltest_mock"
version = "0.5.0"
description = "Fake functions for C suites run by moltest"
repository = "https://github.com/moltobuild/moltest-mock"
license = "Apache-2.0"
artifact = "static"

[target]
std = "c2x"
requires = ["attr_nodiscard"]
defines = ["_DEFAULT_SOURCE", "__USE_MINGW_ANSI_STDIO=1"]
include = ["include"]
flags = ["-Wall", "-Wextra", "-Wpedantic"]

[test]
mode = "single"

# The plugin calls the moltest API. The dependency graph shares this runner
# with consumers and the package's tests.
[deps]
moltest = { git = "https://github.com/moltobuild/moltest", rev = "9e0611007d3b1ccebd589273dd14a7a229265c3c" }

[profile.debug]
opt_level = 0
debug_info = true

[profile.release]
opt_level = 3
debug_info = false
